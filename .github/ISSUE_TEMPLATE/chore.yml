name: Chore
description: Maintenance, tooling, configuration, dependency, or infrastructure work
labels:
  - chore
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be changed?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this work necessary?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Required change is completed
        - [ ] Build and tests pass
        - [ ] Relevant configuration/documentation is updated
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes